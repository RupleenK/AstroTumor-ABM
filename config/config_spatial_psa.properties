# ----- Analysis Settings -----
analysis.mode=SPATIAL_PSA
num.samples=1000
replications=10

# Number of grids (spatial distributions)
spatial.distributions=6

# For each grid index, define which distribution to use:
distribution.0=uniform
distribution.1=random
distribution.2=clumped
distribution.3=inverseRadial
distribution.4=radial
distribution.5=gradient

# ----- Grid Parameters -----
grid.width=300
grid.height=300
vis.scale=1
timesteps=150

# ----- Parameter Ranges (PSA with 6 grids for spatial) -----
effectAntiMet.min=0.0
effectAntiMet.max=1.0
effectProMet.min=0.0
effectProMet.max=1.0
conversionThreshold.min=0.0
conversionThreshold.max=1.0
effectPerTumorCell.min=0.0
effectPerTumorCell.max=1.0
S2.discrete=8.0,16.0,32.0
S4.discrete=4.0,8.0,16.0

# For each grid
grid.0.enable.astrocyteSwitch = true
grid.0.enable.chemotherapy = false

grid.1.enable.astrocyteSwitch = true
grid.1.enable.chemotherapy = false

grid.2.enable.astrocyteSwitch = true
grid.2.enable.chemotherapy = false

grid.3.enable.astrocyteSwitch = true
grid.3.enable.chemotherapy = false

grid.4.enable.astrocyteSwitch = true
grid.4.enable.chemotherapy = false

grid.5.enable.astrocyteSwitch = true
grid.5.enable.chemotherapy = false